<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Font Library</title>
<style>
:root {
  --bg: #f6f5f2; --surface: #ffffff; --fg: #1a1916; --muted: #6b6860; --line: #e4e1da;
  --chip: #efece6; --chip-on: #1a1916; --chip-on-fg: #f6f5f2; --accent: #2747d6; --ok: #137a4b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111110; --surface: #1b1a18; --fg: #f1efe9; --muted: #a29e94; --line: #2c2a27;
    --chip: #24231f; --chip-on: #f1efe9; --chip-on-fg: #111110; --accent: #8ea2ff; --ok: #5fd39a;
  }
}
:root[data-theme="dark"] {
  --bg: #111110; --surface: #1b1a18; --fg: #f1efe9; --muted: #a29e94; --line: #2c2a27;
  --chip: #24231f; --chip-on: #f1efe9; --chip-on-fg: #111110; --accent: #8ea2ff; --ok: #5fd39a;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); }
body { font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 0 16px; }
header { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top { display: flex; align-items: center; gap: 12px; padding: 14px 0 10px; flex-wrap: wrap; }
.brand { font-weight: 700; font-size: 16px; letter-spacing: -0.01em; margin-right: auto; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.tabs { display: flex; gap: 4px; background: var(--chip); padding: 3px; border-radius: 10px; }
.tabs button { border: 0; background: transparent; color: var(--muted); font: inherit; font-weight: 600; padding: 6px 12px; border-radius: 8px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / .08); }
.iconbtn { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 8px; padding: 6px 10px; font: inherit; cursor: pointer; }
.controls { display: grid; grid-template-columns: 1fr auto; gap: 8px 10px; padding-bottom: 10px; align-items: center; }
.controls input[type=text], .controls select { width: 100%; font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
.row2 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row2 label { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); white-space: nowrap; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; padding-bottom: 12px; }
.chip { border: 0; background: var(--chip); color: var(--fg); font: inherit; font-size: 12.5px; padding: 4px 10px; border-radius: 99px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-fg); }
.chip.role { font-weight: 600; }
.count { color: var(--muted); padding: 12px 0 4px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; padding-bottom: 60px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 16px 12px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card h3 { margin: 0; font-size: 15px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.card h3 code { font-size: 11.5px; color: var(--muted); font-weight: 400; }
.sample { font-size: var(--size, 34px); line-height: 1.2; min-height: 2.6em; overflow-wrap: anywhere; transition: opacity .3s; }
.sample.loading { opacity: .35; }
.sample[dir=rtl] { line-height: 1.8; }
.sample.urdu { line-height: 2.3; }
.weights { display: flex; gap: 12px; color: var(--muted); font-size: 15px; flex-wrap: wrap; }
.note { color: var(--muted); font-size: 13px; margin: 0; }
.tags { display: flex; gap: 4px; flex-wrap: wrap; }
.tag { font-size: 11px; border: 1px solid var(--line); padding: 1px 7px; border-radius: 99px; color: var(--muted); }
.tag.g { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, var(--line)); }
.actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; padding-top: 4px; border-top: 1px solid var(--line); }
.actions button, .actions a { font: inherit; font-size: 12px; color: var(--accent); background: none; border: 0; padding: 6px 4px; cursor: pointer; text-decoration: none; }
.pair { padding: 20px; gap: 12px; }
.pair .ph { font-size: clamp(28px, 3.4vw, 40px); line-height: 1.08; letter-spacing: -0.015em; }
.pair .pb { font-size: 16px; line-height: 1.6; }
.pair .pm { font-size: 13px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; overflow: auto; white-space: pre; }
.pair .pa { font-size: 22px; line-height: 1.9; border-top: 1px solid var(--line); padding-top: 10px; }
.pair .pa.urdu { line-height: 2.4; }
.meta { font: 11.5px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.on { opacity: 1; }
[hidden] { display: none !important; }
@media (max-width: 640px) {
  .grid { grid-template-columns: 1fr; }
  .controls { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div class="brand">Font Library<small id="sub"></small></div>
      <div class="tabs" role="tablist">
        <button role="tab" aria-selected="true" data-tab="fonts">Fonts</button>
        <button role="tab" aria-selected="false" data-tab="pairs">Pairings</button>
      </div>
      <button class="iconbtn" id="theme" title="Toggle light/dark">◐</button>
    </div>
    <div class="controls">
      <input type="text" id="q" placeholder="Search fonts, moods, notes… or type your own preview text below">
      <div class="row2">
        <select id="script" aria-label="Script">
          <option value="">All scripts</option><option value="arabic">Arabic</option><option value="urdu">Urdu (Nastaliq)</option>
          <option value="cyrillic">Cyrillic</option><option value="greek">Greek</option><option value="vietnamese">Vietnamese</option><option value="cjk">CJK</option>
        </select>
        <select id="cat" aria-label="Category">
          <option value="">Any style</option><option value="sans-serif">Sans</option><option value="serif">Serif</option>
          <option value="monospace">Mono</option><option value="display">Display</option><option value="handwriting">Handwriting</option>
        </select>
        <label><input type="checkbox" id="var"> Variable</label>
        <label><input type="checkbox" id="goog"> Google</label>
      </div>
      <input type="text" id="txt" placeholder="Preview text (default: a pangram)">
      <div class="row2"><label>Size <input type="range" id="size" min="16" max="80" value="34"></label></div>
    </div>
    <div class="chips" id="roles"></div>
    <div class="chips" id="moods"></div>
  </div>
</header>
<main class="wrap">
  <div class="count" id="count"></div>
  <section class="grid" id="fonts"></section>
  <section class="grid" id="pairs" hidden></section>
</main>
<div class="toast" id="toast"></div>
<script>
const FONTS = __FONTS__;
const PAIRS = __PAIRS__;
const BY = Object.fromEntries(FONTS.map(f => [f.id, f]));
const CMD = "python3 ~/.claude/skills/fonts/scripts/fonts.py";
const SAMPLES = {
  latin: "Sphinx of black quartz, judge my vow",
  arabic: "الخط الجميل يجعل القراءة متعة",
  urdu: "خوبصورت تحریر پڑھنے کا لطف",
  "noto-sans-sc": "我能吞下玻璃而不伤身体", "noto-sans-jp": "いろはにほへと ちりぬるを", "noto-sans-kr": "다람쥐 헌 쳇바퀴에 타고파", "pretendard": "다람쥐 헌 쳇바퀴에 타고파"
};
const ROLES = ["ui", "text", "display", "editorial", "mono", "arabic", "urdu", "cjk"];
const MOODS = [...new Set(FONTS.flatMap(f => f.moods))].sort();
const state = { tab: "fonts", roles: new Set(), moods: new Set() };
const $ = s => document.querySelector(s);

function storeGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function storeSet(k, v) { try { localStorage.setItem(k, v); } catch {} }

const loaded = new Set();
function loadFont(f, weights) {
  if (!f) return Promise.resolve();
  const urls = f.variable ? [`https://cdn.jsdelivr.net/npm/@fontsource-variable/${f.id}/index.css`]
    : (weights || [400, 700]).filter(w => f.weights.includes(w)).map(w => `https://cdn.jsdelivr.net/npm/@fontsource/${f.id}/${w}.css`);
  if (!urls.length) urls.push(`https://cdn.jsdelivr.net/npm/@fontsource/${f.id}/${f.weights[0]}.css`);
  return Promise.all(urls.map(u => new Promise(res => {
    if (loaded.has(u)) return res();
    loaded.add(u);
    const l = document.createElement("link"); l.rel = "stylesheet"; l.href = u; l.onload = l.onerror = res;
    document.head.appendChild(l);
  })));
}
const fam = f => `'${f.family}${f.variable ? " Variable" : ""}', '${f.family}', ${f.category === "serif" ? "serif" : f.category === "monospace" ? "monospace" : "sans-serif"}`;
const isArabic = f => f.roles[0] === "arabic" || f.roles.includes("urdu") || !f.subsets.includes("latin");
const sampleFor = f => {
  const custom = $("#txt").value.trim();
  if (SAMPLES[f.id]) return { t: custom || SAMPLES[f.id], rtl: false };
  if (f.roles.includes("urdu")) return { t: custom || SAMPLES.urdu, rtl: true, urdu: true };
  if (isArabic(f)) return { t: custom || SAMPLES.arabic, rtl: true };
  return { t: custom || SAMPLES.latin, rtl: false };
};

const io = new IntersectionObserver(entries => {
  for (const e of entries) if (e.isIntersecting) {
    io.unobserve(e.target);
    const ids = e.target.dataset.load.split(",").filter(Boolean);
    Promise.all(ids.map(i => loadFont(BY[i], [400, 600, 700]))).then(() => document.fonts.ready)
      .then(() => e.target.querySelectorAll(".loading").forEach(n => n.classList.remove("loading")));
  }
}, { rootMargin: "300px" });

function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); setTimeout(() => t.classList.remove("on"), 1400); }
function copy(text, msg) { navigator.clipboard?.writeText(text).then(() => toast(msg || "Copied"), () => toast(text)); }
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function scriptsOf(f) {
  const s = new Set(f.subsets);
  if (f.roles.includes("urdu")) s.add("urdu");
  if (f.roles.includes("cjk")) s.add("cjk");
  return s;
}

function renderFonts() {
  const q = $("#q").value.trim().toLowerCase(), sc = $("#script").value, cat = $("#cat").value;
  const list = FONTS.filter(f =>
    (!q || (f.family + " " + f.note + " " + f.moods.join(" ") + " " + f.roles.join(" ")).toLowerCase().includes(q)) &&
    (!sc || scriptsOf(f).has(sc)) && (!cat || f.category === cat) &&
    (!$("#var").checked || f.variable) && (!$("#goog").checked || f.type === "google") &&
    [...state.roles].every(r => f.roles.includes(r)) &&
    (!state.moods.size || [...state.moods].some(m => f.moods.includes(m))));
  $("#count").textContent = `${list.length} of ${FONTS.length} fonts`;
  const size = $("#size").value;
  $("#fonts").innerHTML = list.map(f => {
    const s = sampleFor(f);
    const ws = f.variable ? [300, 400, 600, 800].filter(w => w >= f.wr[0] && w <= f.wr[1]) : f.weights.filter(w => [300, 400, 500, 700, 900].includes(w)).slice(0, 4);
    return `<article class="card" data-load="${f.id}">
      <h3>${esc(f.family)} <code>${f.id}</code></h3>
      <div class="sample loading${s.urdu ? " urdu" : ""}" ${s.rtl ? 'dir="rtl"' : ""} style="font-family:${fam(f)};--size:${size}px">${esc(s.t)}</div>
      <div class="weights loading" style="font-family:${fam(f)}">${ws.map(w => `<span style="font-weight:${w}">${s.rtl ? "أبجد" : "Ag"} ${w}</span>`).join("")}</div>
      <p class="note">${esc(f.note)}</p>
      <div class="tags">${f.type === "google" ? '<span class="tag g">Google Fonts</span>' : '<span class="tag">Fontsource only</span>'}
        <span class="tag">${f.variable ? `variable ${f.wr[0]}–${f.wr[1]}` : `${f.weights.length} weights`}</span>
        ${f.styles.includes("italic") ? '<span class="tag">italic</span>' : ""}
        ${f.roles.map(r => `<span class="tag">${r}</span>`).join("")}
        ${f.moods.slice(0, 4).map(m => `<span class="tag">${m}</span>`).join("")}</div>
      <div class="actions">
        <button data-copy="${f.id}">Copy id</button>
        <button data-copy="${CMD} install ${f.id} --stack next">Next.js</button>
        <button data-copy="${CMD} install ${f.id} --stack fontsource">Fontsource</button>
        <button data-copy="${CMD} download ${f.id} --out public/fonts">Self-host</button>
        ${f.repo ? `<a href="https://github.com/${f.repo}" target="_blank" rel="noopener">GitHub</a>` : ""}
        <a href="https://fontsource.org/fonts/${f.id}" target="_blank" rel="noopener">Fontsource</a>
      </div></article>`;
  }).join("");
  document.querySelectorAll("#fonts .card").forEach(c => io.observe(c));
}

function resolvePair(p) {
  const lp = p.latin_partner, latinOk = i => i && BY[i] && BY[i].subsets.includes("latin") && !isArabic(BY[i]);
  return { h: p.heading && (!lp || latinOk(p.heading)) ? p.heading : lp, b: lp || p.body, m: p.mono, a: p.arabic, ad: p.arabic_display || p.arabic };
}

function installArgs(r) {
  const seen = new Set(), rs = [["heading", r.h], ["body", r.b], ["mono", r.m], ["arabic", r.a]]
    .filter(([, id]) => id && !seen.has(id) && seen.add(id));
  return rs.map(x => x[1]).join(" ") + " --roles " + rs.map(x => x[0]).join(",");
}

function renderPairs() {
  const q = $("#q").value.trim().toLowerCase(), sc = $("#script").value;
  const list = PAIRS.filter(p => (!q || (p.name + p.use + p.why + p.moods.join(" ")).toLowerCase().includes(q)) &&
    (!state.moods.size || [...state.moods].some(m => p.moods.includes(m))) &&
    (!sc || sc === "arabic" || (sc === "urdu" && /urdu/i.test(p.name + p.use))));
  $("#count").textContent = `${list.length} of ${PAIRS.length} pairings`;
  const custom = $("#txt").value.trim();
  $("#pairs").innerHTML = list.map(p => {
    const r = resolvePair(p), H = BY[r.h], B = BY[r.b], M = BY[r.m], A = BY[r.a], AD = BY[r.ad];
    const urdu = (A && A.roles.includes("urdu")) || (AD && AD.roles.includes("urdu"));
    return `<article class="card pair" data-load="${[r.h, r.b, r.m, r.a, r.ad].filter(Boolean).join(",")}">
      <div class="meta">${esc(p.name)} · ${esc(H.family)} ${p.heading_weight || 700} / ${esc(B.family)}${M ? " / " + esc(M.family) : ""}</div>
      <div class="ph loading" style="font-family:${fam(H)};font-weight:${p.heading_weight || 700}">${esc(custom || "Design that reads like it means it")}</div>
      <div class="pb loading" style="font-family:${fam(B)}">${esc(p.use)}. ${esc(p.why)}</div>
      ${M ? `<div class="pm loading" style="font-family:${fam(M)}">const total = items.reduce((a, b) =&gt; a + b, 0); // 1,024.50</div>` : ""}
      ${A ? `<div class="pa loading${urdu ? " urdu" : ""}" dir="rtl" style="font-family:${fam(AD || A)}">${urdu ? SAMPLES.urdu : SAMPLES.arabic}</div>
      <div class="meta">${esc(A.family)}${AD && AD !== A ? " / " + esc(AD.family) : ""}</div>` : ""}
      <div class="actions">
        <button data-copy="${CMD} tokens --pairing ${p.id}">Copy tokens cmd</button>
        <button data-copy="${CMD} install ${installArgs(r)} --stack next">Next.js</button>
        <button data-copy="${p.id}">Copy id</button>
      </div></article>`;
  }).join("");
  document.querySelectorAll("#pairs .card").forEach(c => io.observe(c));
}

function render() {
  $("#fonts").hidden = state.tab !== "fonts"; $("#pairs").hidden = state.tab !== "pairs";
  $("#roles").hidden = state.tab !== "fonts";
  state.tab === "fonts" ? renderFonts() : renderPairs();
}

function chips(el, items, set, cls) {
  el.innerHTML = items.map(i => `<button class="chip ${cls}" aria-pressed="false" data-v="${i}">${i}</button>`).join("");
  el.addEventListener("click", e => {
    const b = e.target.closest(".chip"); if (!b) return;
    const v = b.dataset.v; set.has(v) ? set.delete(v) : set.add(v);
    b.setAttribute("aria-pressed", set.has(v)); render();
  });
}
chips($("#roles"), ROLES, state.roles, "role");
chips($("#moods"), MOODS, state.moods, "");
$("#sub").textContent = `${FONTS.length} curated fonts · ${PAIRS.length} pairings`;
["#q", "#txt", "#script", "#cat", "#var", "#goog"].forEach(s => $(s).addEventListener("input", render));
$("#size").addEventListener("input", () => document.querySelectorAll(".sample").forEach(n => n.style.setProperty("--size", $("#size").value + "px")));
document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => {
  state.tab = b.dataset.tab; storeSet("fonts-tab", state.tab);
  document.querySelectorAll(".tabs button").forEach(x => x.setAttribute("aria-selected", x === b)); render();
}));
document.addEventListener("click", e => { const b = e.target.closest("[data-copy]"); if (b) copy(b.dataset.copy); });
$("#theme").addEventListener("click", () => {
  const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark"; storeSet("fonts-theme", r.dataset.theme);
});
const savedTheme = storeGet("fonts-theme"); if (savedTheme) document.documentElement.dataset.theme = savedTheme;
const savedTab = storeGet("fonts-tab"); if (savedTab === "pairs") document.querySelector('[data-tab="pairs"]').click(); else render();
</script>
</body>
</html>
